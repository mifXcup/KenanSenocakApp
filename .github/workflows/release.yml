name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Prepare backend environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
      - name: Configure the update source
        shell: pwsh
        run: npm run configure:update -- $env:GITHUB_REPOSITORY
      - name: Build Windows release assets
        shell: pwsh
        run: npm run dist
      - name: Publish installer and update manifest
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist-desktop/*.exe
            dist-desktop/*.exe.blockmap
            dist-desktop/latest.yml
